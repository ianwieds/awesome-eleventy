name: Sweep

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check every entry
        id: sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sweep.js README.md awesome.json > "$RUNNER_TEMP/sweep.md"
          verdict=$(tail -n 1 "$RUNNER_TEMP/sweep.md")
          case "$verdict" in
            "verdict: pass" | "verdict: fail") echo "verdict=${verdict#verdict: }" >> "$GITHUB_OUTPUT" ;;
            *) echo "sweep.js ended without a verdict"; cat "$RUNNER_TEMP/sweep.md"; exit 1 ;;
          esac

      - name: Keep the Entries to review issue current
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.sweep.outputs.verdict }}
        run: |
          marker='<!-- awesome:sweep -->'
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json number,body \
            --jq ".[] | select(.body | contains(\"$marker\")) | .number" | head -n 1)
          if [ "$VERDICT" = pass ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "The latest sweep found nothing to review."
            fi
            exit 0
          fi
          { echo "$marker"; sed '$d' "$RUNNER_TEMP/sweep.md"; } > "$RUNNER_TEMP/body.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "Entries to review" --body-file "$RUNNER_TEMP/body.md"
          fi
